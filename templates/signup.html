{%extends 'base.html'%}
{%load static%}
{%block css%}
<link rel="stylesheet" href="{%static 'login.css'%}">
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<style>
  .g-recaptcha {
  margin: 15px auto;
  display: flex;
  justify-content: center;
}
</style>
{%endblock%}

{%block content%}
<div class="back" style="background-image: url({{random.url}});">

</div>
<form class="wrapper" method="post">
    {%csrf_token%}
    <div class="login_box">
      <div class="login-header">
        <span>Sign-up</span>
      </div>
      <div>
        {%if message != 'None'%}
            <p class="error" style="color: red;">{{message}}</p>
            <style>
                .error{
                    position: relative;
                    display: flex;
                    justify-content: center;
                    animation: shake 0.3s forwards;
                }
                @keyframes shake {
                    20%{
                        top: 10px;
                    }
                    40%{
                        top: -10px;
                    }
                    60%{
                        top: 6px;
                    }
                    80%{
                        top: -6px;
                    }
                    100%{
                        top: 3px;
                    }
                }
            </style>
        {%endif%}
      </div>
      <div class="input_box">
        <input type="text" id="user" name="user" class="input-field" required placeholder="Your name">
        <label for="user" class="label">Your name</label>
        <i class="bx bx-user icon"></i>
      </div>
      <div class="input_box">
        <input type="text" id="email" name="email" class="input-field" required placeholder="Your email">
        <label for="email" class="label">Your email</label>
        <i class="bx bx-user icon"></i>
      </div>
      <div class="input_box">
        <input type="password" id="password" name="password" class="input-field" required placeholder="Set password">
        <label for="password" class="label">Set password</label>
        <i class="bx bx-lock-alt icon"></i>
        <div id="password-error" class="error-message"></div>
      </div>
      
      <div class="input_box">
        <input type="password" id="password2" name="password2" class="input-field" required placeholder="Confirm password">
        <label for="password2" class="label">Confirm password</label>
        <i class="bx bx-lock-alt icon"></i>
        <div id="confirm-error" class="error-message"></div>
      </div>

      <div class="g-recaptcha" data-sitekey="6LcKlxwrAAAAAPu-Czpp8EHDuVRFPngVc-1jUeyt"></div>

      <div class="input_box">
        <input type="submit" class="input-submit" value="Register">
      </div>
      <div class="register">
        <span>Already have an account? <a href="{%url 'login'%}">Login</a></span>
      </div>
    </div>
</form>

<script>
  function validatePassword(password) {
    const errors = [];

    if (password.length < 8) {
      errors.push("Password must be at least 8 characters.");
    }
    if (!/[a-z]/.test(password)) {
      errors.push("Password must include at least one lowercase letter.");
    }
    if (!/[0-9]/.test(password)) {
      errors.push("Password must include at least one digit.");
    }

    return errors;
  }

  document.addEventListener("DOMContentLoaded", () => {
    const form = document.querySelector("form");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("password2");

    const passwordError = document.getElementById("password-error");
    const confirmError = document.getElementById("confirm-error");

    form.addEventListener("submit", (e) => {
      let hasError = false;
      const password = passwordInput.value;
      const confirm = confirmInput.value;

      // Clear previous errors
      passwordError.textContent = "";
      confirmError.textContent = "";

      const validationErrors = validatePassword(password);
      if (validationErrors.length > 0) {
        hasError = true;
        passwordError.innerHTML = validationErrors.join("<br>");
      }

      if (password !== confirm) {
        hasError = true;
        confirmError.textContent = "Passwords do not match.";
      }

      if (hasError) e.preventDefault();
    });
  });
</script>

{%endblock%}
